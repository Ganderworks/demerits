[package]
name = "demerits"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Deterministic Knuth–Plass line breaking"
repository = "https://github.com/Ganderworks/demerits"
readme = "README.md"
keywords = ["typesetting", "line-breaking", "knuth-plass", "justification", "hyphenation"]
categories = ["text-processing"]
exclude = [".cargo/**/*", ".github/**/*", "assets/imgs/**/*"]

[dependencies]

# The test levels live in `trials`, an unpublished crate, so the levels never
# show up as features of demerits itself.
[workspace]
members = [".", "trials"]
default-members = [".", "trials"]
